<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 600 19px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .body { font: 15px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .tiny { font: 12px Arial, Helvetica, sans-serif; fill: #6b7280; }

      .card-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 22; ry: 22; }
      .card-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 22; ry: 22; }
      .card-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 22; ry: 22; }
      .card-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2.2; rx: 22; ry: 22; }
      .card-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 22; ry: 22; }
      .chip { fill: white; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; }

      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 9 8; }
      .soft { stroke: #64748b; }
    </style>

    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#334155"></path>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" class="title">Newt: Cleaner Presentation-Style Method Diagram</text>
  <text x="800" y="85" text-anchor="middle" class="body">
    Multitask world model with language, optional vision, latent dynamics, planning, and joint training
  </text>

  <!-- Column 1: Inputs -->
  <rect x="70" y="165" width="290" height="440" class="card-blue"></rect>
  <text x="215" y="205" text-anchor="middle" class="subtitle">1. Multitask Inputs</text>

  <rect x="100" y="245" width="230" height="62" class="chip"></rect>
  <text x="215" y="270" text-anchor="middle" class="label">Language Instruction</text>
  <text x="215" y="292" text-anchor="middle" class="small">task description</text>

  <rect x="100" y="335" width="230" height="62" class="chip"></rect>
  <text x="215" y="360" text-anchor="middle" class="label">RGB Observation</text>
  <text x="215" y="382" text-anchor="middle" class="small">optional image input</text>

  <rect x="100" y="425" width="230" height="62" class="chip"></rect>
  <text x="215" y="450" text-anchor="middle" class="label">State Vector</text>
  <text x="215" y="472" text-anchor="middle" class="small">low-dimensional features</text>

  <rect x="100" y="520" width="230" height="52" class="chip"></rect>
  <text x="215" y="552" text-anchor="middle" class="small">All inputs come from the multitask environment</text>

  <!-- Column 2: Encoders -->
  <rect x="430" y="135" width="340" height="500" class="card-purple"></rect>
  <text x="600" y="175" text-anchor="middle" class="subtitle">2. Encoders and Fusion</text>

  <rect x="470" y="220" width="260" height="78" class="chip"></rect>
  <text x="600" y="247" text-anchor="middle" class="label">CLIP Text Encoder</text>
  <text x="600" y="270" text-anchor="middle" class="body">g = CLIP<tspan baseline-shift="sub" font-size="12">text</tspan>(s<tspan baseline-shift="sub" font-size="12">lang</tspan>)</text>
  <text x="600" y="288" text-anchor="middle" class="tiny">frozen pretrained backbone</text>

  <rect x="470" y="325" width="260" height="78" class="chip"></rect>
  <text x="600" y="352" text-anchor="middle" class="label">DINOv2 Image Encoder</text>
  <text x="600" y="375" text-anchor="middle" class="body">x = DINOv2(s<tspan baseline-shift="sub" font-size="12">img</tspan>)</text>
  <text x="600" y="393" text-anchor="middle" class="tiny">frozen pretrained backbone</text>

  <rect x="470" y="440" width="260" height="110" class="chip"></rect>
  <text x="600" y="470" text-anchor="middle" class="label">State Encoder + Fusion</text>
  <text x="600" y="498" text-anchor="middle" class="body">z = h(s<tspan baseline-shift="sub" font-size="12">state</tspan>, x, g)</text>
  <text x="600" y="523" text-anchor="middle" class="small">concatenate modalities</text>
  <text x="600" y="543" text-anchor="middle" class="small">→ shared latent state</text>

  <!-- Column 3: World Model -->
  <rect x="850" y="120" width="330" height="530" class="card-green"></rect>
  <text x="1015" y="160" text-anchor="middle" class="subtitle">3. World Model Core</text>

  <rect x="885" y="220" width="260" height="78" class="chip"></rect>
  <text x="1015" y="248" text-anchor="middle" class="label">Latent Dynamics</text>
  <text x="1015" y="272" text-anchor="middle" class="body">z′ = d(z, a, g)</text>
  <text x="1015" y="290" text-anchor="middle" class="tiny">predicts next latent state</text>

  <rect x="885" y="325" width="260" height="78" class="chip"></rect>
  <text x="1015" y="353" text-anchor="middle" class="label">Reward Predictor</text>
  <text x="1015" y="377" text-anchor="middle" class="body">r̂ = R(z, a, g)</text>
  <text x="1015" y="395" text-anchor="middle" class="tiny">predicts immediate reward</text>

  <rect x="885" y="430" width="260" height="78" class="chip"></rect>
  <text x="1015" y="458" text-anchor="middle" class="label">Value Predictor</text>
  <text x="1015" y="482" text-anchor="middle" class="body">q̂ = Q(z, a, g)</text>
  <text x="1015" y="500" text-anchor="middle" class="tiny">predicts discounted return</text>

  <rect x="885" y="535" width="260" height="78" class="chip"></rect>
  <text x="1015" y="563" text-anchor="middle" class="label">Policy Prior</text>
  <text x="1015" y="587" text-anchor="middle" class="body">â = p(z, g)</text>
  <text x="1015" y="605" text-anchor="middle" class="tiny">suggests strong candidate actions</text>

  <!-- Column 4: Planning + Interaction -->
  <rect x="1260" y="165" width="270" height="235" class="card-amber"></rect>
  <text x="1395" y="205" text-anchor="middle" class="subtitle">4. Planning</text>

  <rect x="1295" y="250" width="200" height="72" class="chip"></rect>
  <text x="1395" y="278" text-anchor="middle" class="label">Trajectory Optimization</text>
  <text x="1395" y="301" text-anchor="middle" class="small">plan in latent space</text>

  <rect x="1330" y="340" width="130" height="44" class="chip"></rect>
  <text x="1395" y="368" text-anchor="middle" class="label">Action a</text>

  <rect x="1260" y="445" width="270" height="160" class="card-blue"></rect>
  <text x="1395" y="485" text-anchor="middle" class="subtitle">5. Environment Loop</text>
  <text x="1395" y="520" text-anchor="middle" class="body">Execute action in multitask environment</text>
  <text x="1395" y="550" text-anchor="middle" class="body">Collect new transitions</text>
  <text x="1395" y="580" text-anchor="middle" class="body">Store data in replay buffer</text>

  <!-- Replay buffer -->
  <rect x="580" y="710" width="440" height="110" class="card-blue"></rect>
  <text x="800" y="748" text-anchor="middle" class="subtitle">Replay Buffer</text>
  <text x="800" y="780" text-anchor="middle" class="body">Sample trajectories τ ~ B for training updates</text>

  <!-- Training objective -->
  <rect x="1070" y="680" width="450" height="150" class="card-red"></rect>
  <text x="1295" y="718" text-anchor="middle" class="subtitle">6. Joint Training Objective</text>
  <text x="1100" y="755" class="body">• Self-prediction: align predicted next latent with target latent</text>
  <text x="1100" y="785" class="body">• Reward loss: predict task reward</text>
  <text x="1100" y="815" class="body">• Value loss: predict discounted return</text>

  <!-- Arrows -->
  <!-- Inputs to encoders -->
  <path d="M 360 275 L 470 259" class="arrow"></path>
  <path d="M 360 366 L 470 364" class="arrow"></path>
  <path d="M 360 456 L 470 496" class="arrow"></path>

  <!-- CLIP and DINO to fusion -->
  <path d="M 600 298 L 600 440" class="arrow dashed soft"></path>
  <path d="M 600 403 L 600 440" class="arrow dashed soft"></path>

  <!-- Fusion to world model -->
  <path d="M 730 495 L 885 258" class="arrow"></path>
  <path d="M 730 495 L 885 364" class="arrow"></path>
  <path d="M 730 495 L 885 469" class="arrow"></path>
  <path d="M 730 495 L 885 574" class="arrow"></path>

  <!-- World model to planner -->
  <path d="M 1145 574 L 1295 286" class="arrow dashed"></path>
  <path d="M 1145 469 L 1295 286" class="arrow dashed"></path>
  <path d="M 1145 364 L 1295 286" class="arrow dashed"></path>

  <!-- Planner to action -->
  <path d="M 1395 322 L 1395 340" class="arrow"></path>

  <!-- Action to env loop -->
  <path d="M 1395 384 L 1395 445" class="arrow"></path>

  <!-- Env loop to replay buffer -->
  <path d="M 1260 565 L 1020 565 L 1020 765" class="arrow"></path>
  <path d="M 1020 765 L 1020 765" class="arrow"></path>

  <!-- Replay buffer to training objective -->
  <path d="M 1020 765 L 1070 765" class="arrow"></path>

  <!-- Training objective back to model -->
  <path d="M 1240 680 L 1240 650 L 1015 650 L 1015 613" class="arrow"></path>
  <path d="M 1160 680 L 1160 650 L 600 650 L 600 550" class="arrow dashed"></path>

  <!-- Environment feedback to inputs -->
  <path d="M 1260 500 L 90 500 L 90 275" class="arrow dashed"></path>

  <!-- Formula callout -->
  <rect x="70" y="690" width="430" height="135" class="card-amber"></rect>
  <text x="285" y="728" text-anchor="middle" class="subtitle">Main Equations</text>
  <text x="100" y="763" class="body">g = CLIP<tspan baseline-shift="sub" font-size="12">text</tspan>(s<tspan baseline-shift="sub" font-size="12">lang</tspan>),   x = DINOv2(s<tspan baseline-shift="sub" font-size="12">img</tspan>)</text>
  <text x="100" y="792" class="body">z = h(s<tspan baseline-shift="sub" font-size="12">state</tspan>, x, g),   z′ = d(z, a, g)</text>
  <text x="100" y="821" class="body">r̂ = R(z, a, g),   q̂ = Q(z, a, g),   â = p(z, g)</text>

  <!-- Footer -->
  <text x="800" y="870" text-anchor="middle" class="tiny">
    Presentation simplification: frozen CLIP/DINOv2 encoders, fused latent state, decoder-free control-centric world model, planning, replay, and joint optimization.
  </text>
</svg>
